<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Graph Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      #controls {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 12px 20px;
        background: rgba(15, 23, 42, 0.95);
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        gap: 16px;
        z-index: 100;
      }
      #controls label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #94a3b8;
      }
      #entitySelect {
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 14px;
        min-width: 280px;
        cursor: pointer;
      }
      #entitySelect:focus {
        outline: none;
        border-color: #6366f1;
      }
      #stats {
        font-size: 13px;
        color: #64748b;
      }
      #graph-container {
        width: 100vw;
        height: calc(100vh - 56px);
        margin-top: 56px;
        position: relative;
      }
      #graph {
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 16px;
        color: #64748b;
      }
      #tooltip {
        position: fixed;
        background: rgba(30, 41, 59, 0.95);
        border: 1px solid #475569;
        border-radius: 8px;
        padding: 12px;
        max-width: 300px;
        font-size: 13px;
        pointer-events: none;
        z-index: 1000;
        display: none;
      }
      #tooltip .content {
        color: #e2e8f0;
        margin-bottom: 8px;
        line-height: 1.4;
        word-break: break-word;
      }
      #tooltip .meta {
        color: #64748b;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <label>
        Entity ID:
        <select id="entitySelect">
          <option value="">-- Select Entity --</option>
        </select>
      </label>
      <span id="stats"></span>
    </div>
    <div id="graph-container">
      <div id="loading">Select an entity to view its memory graph</div>
      <div id="graph"></div>
    </div>
    <div id="tooltip"></div>

    <script src="https://unpkg.com/force-graph@1.47.0/dist/force-graph.min.js"></script>
    <script>
      let graphInstance = null;
      let hoveredNode = null;

      async function loadEntities() {
        try {
          const res = await fetch('/api/entities');
          const entities = await res.json();
          const select = document.getElementById('entitySelect');
          entities.forEach(id => {
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = id;
            select.appendChild(opt);
          });
        } catch (error) {
          console.error('Failed to load entities:', error);
        }
      }

      function showTooltip(node) {
        const tooltip = document.getElementById('tooltip');
        const content =
          node.content.length > 200 ? node.content.slice(0, 200) + '...' : node.content;

        tooltip.innerHTML = `
          <div class="content">${escapeHtml(content)}</div>
          <div class="meta">Edges: ${node.edgeCount} | ${new Date(node.createdAt).toLocaleString()}</div>
        `;
        tooltip.style.display = 'block';
      }

      function hideTooltip() {
        document.getElementById('tooltip').style.display = 'none';
      }

      function updateTooltipPosition(e) {
        const tooltip = document.getElementById('tooltip');
        if (tooltip.style.display === 'none') return;

        let x = e.clientX + 15;
        let y = e.clientY + 15;

        const rect = tooltip.getBoundingClientRect();
        if (x + rect.width > window.innerWidth - 10) {
          x = e.clientX - rect.width - 15;
        }
        if (y + rect.height > window.innerHeight - 10) {
          y = e.clientY - rect.height - 15;
        }

        tooltip.style.left = x + 'px';
        tooltip.style.top = y + 'px';
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function processLinks(links) {
        const linkPairs = new Map();

        links.forEach(link => {
          const forwardKey = `${link.source}|${link.target}`;
          const reverseKey = `${link.target}|${link.source}`;

          if (linkPairs.has(reverseKey)) {
            linkPairs.get(reverseKey).bidirectional = true;
          } else {
            linkPairs.set(forwardKey, { ...link, bidirectional: false });
          }
        });

        return Array.from(linkPairs.values());
      }

      async function loadGraph(entityId) {
        if (!entityId) return;

        const loading = document.getElementById('loading');
        loading.textContent = 'Loading graph...';
        loading.style.display = 'block';
        hideTooltip();
        hoveredNode = null;

        try {
          const res = await fetch(`/api/graph?entityId=${encodeURIComponent(entityId)}`);
          const data = await res.json();

          document.getElementById('stats').textContent =
            `Nodes: ${data.nodes.length} | Edges: ${data.links.length}`;
          loading.style.display = 'none';

          const container = document.getElementById('graph');
          container.innerHTML = '';

          if (graphInstance) {
            graphInstance._destructor && graphInstance._destructor();
            graphInstance = null;
          }

          const processedLinks = processLinks(data.links);
          const processedData = { nodes: data.nodes, links: processedLinks };

          const nodeColor = '#6366f1';
          const linkColor = '#94a3b8';
          const NODE_R = 6;

          graphInstance = ForceGraph()(container)
            .graphData(processedData)
            .nodeId('id')
            .nodeLabel(null)
            .nodeColor(() => nodeColor)
            .nodeRelSize(NODE_R)
            .linkWidth(2)
            .linkDirectionalArrowLength(6)
            .linkDirectionalArrowRelPos(1)
            .linkDirectionalArrowColor(() => linkColor)
            .linkCanvasObjectMode(() => 'after')
            .linkCanvasObject((link, ctx, globalScale) => {
              if (!link.bidirectional) return;

              const start = link.source;
              const end = link.target;
              if (typeof start !== 'object' || typeof end !== 'object') return;

              const dx = end.x - start.x;
              const dy = end.y - start.y;
              const len = Math.sqrt(dx * dx + dy * dy);
              if (len === 0) return;

              // Unit vector from start to end
              const ux = dx / len;
              const uy = dy / len;

              const arrowLen = 6;
              const arrowWidth = 4;

              // Reverse arrow: tip at source node edge, pointing INTO source
              // Same positioning logic as the built-in arrow (which is at target)
              const tipX = start.x + ux * NODE_R;
              const tipY = start.y + uy * NODE_R;

              // Arrow base extends outward along the link (away from source)
              const baseX = tipX + ux * arrowLen;
              const baseY = tipY + uy * arrowLen;

              // Perpendicular for arrow width
              const perpX = (-uy * arrowWidth) / 2;
              const perpY = (ux * arrowWidth) / 2;

              ctx.beginPath();
              ctx.moveTo(tipX, tipY);
              ctx.lineTo(baseX + perpX, baseY + perpY);
              ctx.lineTo(baseX - perpX, baseY - perpY);
              ctx.closePath();
              ctx.fillStyle = linkColor;
              ctx.fill();
            })
            .linkColor(() => linkColor)
            .backgroundColor('#0f172a')
            .width(container.clientWidth)
            .height(container.clientHeight)
            .onNodeHover(node => {
              hoveredNode = node;
              container.style.cursor = node ? 'pointer' : 'default';
              if (node) {
                showTooltip(node);
              } else {
                hideTooltip();
              }
            })
            .onNodeClick(node => {
              if (node) {
                navigator.clipboard.writeText(node.id).then(() => {
                  console.log('Node ID copied:', node.id);
                });
              }
            });
        } catch (error) {
          console.error('Failed to load graph:', error);
          loading.textContent = 'Failed to load graph';
        }
      }

      document.getElementById('entitySelect').addEventListener('change', e => {
        loadGraph(e.target.value);
      });

      document.addEventListener('mousemove', updateTooltipPosition);

      window.addEventListener('resize', () => {
        if (graphInstance) {
          const container = document.getElementById('graph');
          graphInstance.width(container.clientWidth).height(container.clientHeight);
        }
      });

      loadEntities();
    </script>
  </body>
</html>
